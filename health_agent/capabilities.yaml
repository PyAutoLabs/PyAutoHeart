# PyAutoHeart capability manifest
#
# Machine-readable catalogue of every health capability PyAutoHeart exposes.
# The PyAutoBrain Health Agent reads THIS file (not hard-coded check names) so it
# treats Heart as an abstract health provider: when Heart gains or renames a
# check, update this manifest and the agent adapts without code changes.
#
# Maintained alongside the checks. If you add a check (see docs/internals.md "Adding a
# new check"), add an entry here too.

provider:
  name: PyAutoHeart
  role: >-
    The health and vital-signs authority of the PyAuto organism. Owns ALL
    health/readiness checking. Observer-only: reads repos and emits verdicts,
    never writes into other repos, never triggers PyAutoHands/Hands.
  canonical_cli: pyauto-heart
  python_package: heart             # `import heart`

# The single call the Health Agent should make to get the authoritative verdict.
# Everything else is detail the agent may pull for explanation/recommendations.
primary_query:
  command: "pyauto-heart readiness --json"
  returns: "{ verdict: green|yellow|red, score: 0-100, red_reasons[], yellow_reasons[], ts }"
  detail_query: "pyauto-heart status --json"   # full per-repo + per-check snapshot
  dashboard_query: "pyauto-heart dashboard --json"   # the unified board as one card
  persisted_state:
    snapshot: "~/.pyauto-heart/state.json"
    verdict: "~/.pyauto-heart/release_ready.json"
    validation_report: "~/.pyauto-heart/validation_report.json"
  published_board: "https://pyautolabs.github.io/PyAutoHeart/"   # the live GitHub Pages board

# The authoritative gate. The Health Agent REPORTS this verdict; it must not
# re-derive it from raw checks. Heart computes it (heart/readiness.py:compute).
gate:
  authority: "pyauto-heart readiness"   # the single is-it-safe-to-release gate
  semantics:
    green:  "Healthy. PyAutoHands may proceed automatically."
    yellow: "Mostly healthy. Work may proceed; human review recommended."
    red:    "Blocked. Do not release until the blocking reasons clear."
  rule: "red dominates yellow dominates green; an unknown is YELLOW, never silently green."
  release_gate: >-
    GREEN-for-release additionally REQUIRES a fresh, passing validation_report
    (see the `validate` capability) whose commit_shas match the current `main`
    HEADs and whose profile == release. Absent/stale/SHA-mismatch/wrong-profile
    → YELLOW; a failed validation stage → RED. This is the M2 hard gate: no
    release rehearsal for the current source can no longer be GREEN.

# Continuous checks — cheap, run every <30s tick (heart/tick.sh).
continuous_checks:
  - id: repo_state
    impl: heart/checks/repo_state.sh
    measures: "per-repo branch / dirty(real vs generated) / ahead / behind"
    gate_role: "RED if a library is off main, has uncommitted source, or is behind origin"
  - id: ci_status
    impl: heart/checks/ci_status.sh
    measures: "latest CI workflow conclusion per repo (gh run list)"
    gate_role: "RED if a library's latest CI conclusion is not success"
  - id: open_prs
    impl: heart/checks/open_prs.sh
    measures: "open PR count + max age per repo"
    gate_role: "YELLOW if an open PR is >= 7 days old"
  - id: release_run
    impl: heart/checks/release_run.py
    measures: "latest release-integrate.yml run vs the ingested validation_report (per-run-id cached artifact refresh)"
    gate_role: "keeps the release-validation leg fresh; verdict impact flows through validation_report"
  - id: worktree_drift
    impl: heart/checks/worktree_drift.py
    measures: "worktree dirs (wt root + claimed paths) vs PyAutoMind active.md/parked.md (orphan/parked/missing/dirty/canonical-dirty)"
    gate_role: "monitoring (surfaced in status; not a readiness reason)"
  - id: script_timing
    impl: heart/checks/script_timing.py
    measures: "per-script duration vs rolling baseline (>1.5x slow, >3x regression)"
    gate_role: "YELLOW on timing regressions / slow scripts"
  - id: test_run
    impl: heart/checks/test_run.py
    measures: "latest PyAutoHands report.json verdict (ready / counts / stale parked)"
    consumes: "PyAutoHands run_logs/latest/report.json (Build executor primitive)"
    gate_role: "YELLOW if workspace validation not passing / stale / unknown (standing debt, advisory)"
  - id: version_skew
    impl: heart/checks/version_skew.py
    measures: "each workspace's compatibility floor (minimum_library_version) vs the newest library release tag"
    gate_role: "RED if UNSATISFIABLE (floor exceeds newest release) / BAD; STALE if UNKNOWN (newest release unresolvable)"
  - id: manifest_drift
    impl: heart/checks/manifest_drift.py
    measures: "repo identity (name/owner) in Heart/Build/labels lists and checkout origins vs the PyAutoMind/repos.yaml body map"
    consumes: "PyAutoMind/scripts/repos_sync.py --check (Mind owns the manifest and the drift logic; Heart only runs and reports it)"
    gate_role: "YELLOW per drifted surface (identity hygiene, never RED); skipped when no PyAutoMind checkout"
  - id: noise
    impl: heart/noise.py
    measures: "classify git porcelain into real source drift vs regenerated-artifact noise"
    gate_role: "supports repo_state (only real drift counts toward gates)"

# Deep checks — slow; on-demand / cloud cron only, never in the tick.
deep_checks:
  - id: verify_install
    impl: heart/checks/verify_install.sh
    cli: "pyauto-heart verify_install"
    measures: "pip, conda, and Colab install-path checks A-F; Check B exact release succeeds on Python 3.12/3.13 and rejects on 3.11; Check E installs historical 2026.2.26.4 on Python 3.12 because its stack has no Python 3.13 dependency wheels"
    gate_role: "RED if last run ready==false; STALE if find-links-only, older than 14d, or never run"
  - id: url_check
    impl: heart/checks/url_check.sh
    cli: "pyauto-heart url_check [dir]"
    measures: "offline forbidden Binder/Colab/owner URL regex guard for one directory"
    gate_role: "monitoring only — does NOT gate readiness"
  - id: url_sweep
    impl: heart/checks/url_sweep.sh
    cli: "pyauto-heart url_sweep"
    measures: "url_check across every PyAuto repo -> url_check.json"
    gate_role: "monitoring only — does NOT gate readiness"
  - id: url_check_live
    impl: heart/checks/url_check_live.sh    # wrapper entrypoint; calls url_check_live.py
    measures: "live HTTP HEAD/GET audit of URLs (Colab/Binder reachability)"
    gate_role: "monitoring only (weekly cloud workflow)"

# Release validation — the third Heart tier (M2). Not a cheap tick, not the
# existing deep checks: an INGEST-AND-JUDGE capability. Heart defines the report
# spec and folds already-collected artifacts into it; it NEVER dispatches a build
# or talks to GitHub (that is the Brain Release Agent's job — see boundary).
release_validation:
  - id: validate
    impl: heart/validate.py
    cli: "pyauto-heart validate --ingest <artifacts...>"
    signal: validation_report            # ~/.pyauto-heart/validation_report.json
    consumes: >-
      the M1 TestPyPI rehearsal artifact (rehearsal.json / testpypi_version.txt),
      a {repo: sha} commit_shas.json, and (M3, wired) the wheel-based
      `release-stage-report` artifact emitted by the release-integrate.yml
      channel — collected and handed over by the Brain Release Agent.
    produces: >-
      validation_report.json (schema_version 1): validation_outcome
      (pass|fail|incomplete), release_ready (legacy boolean, kept for
      compatibility), testpypi_version, profile, per-repo commit_shas, per-stage
      status, per-project counts, failures, run URLs, timestamp — persisted in
      Heart state + a validation_history/ archive.
    gate_role: >-
      HARD readiness gate. Read validation_outcome, NOT release_ready — the
      boolean collapses "a stage failed" and "no rehearsal evidence" into one
      false, and the tick's integrate-only auto-ingest always lands on that
      false however green the run was. validation_outcome==fail → RED;
      ==incomplete → STALE (an evidence gap, nothing known-bad); absent /
      stale-by-age / commit_shas not matching current main HEADs / profile !=
      release → YELLOW; fresh pass matching current source under the release
      profile → GREEN. A report predating validation_outcome falls back to
      release_ready==false → RED (fail closed).
    orchestrated_by: "PyAutoBrain Release Agent (agents/release/) — dispatch/poll/download"
    boundary: "ingest-and-judge only; never dispatches release.yml or workspace-validation.yml"

# Unified health dashboard (M5) — ONE pure renderer, many surfaces. Every
# surface is a projection of the same snapshot + verdict (+ validation_report),
# so the web page, the CLI line, and the mobile card cannot disagree. The
# Health Agent renders its mobile card from the json/md view of this capability.
dashboard:
  - id: dashboard
    impl: heart/dashboard.py
    cli: "pyauto-heart dashboard [--oneline|--md|--html|--json|--badge] [--cloud]"
    signal: none                         # a projection of existing signals; recomputes nothing
    reads: >-
      the CACHED snapshot only (state.json + release_ready.json +
      validation_report.json) — never ticks, so it is instant.
    formats: "term | oneline | md | html | json (+ a shields badge.json)"
    surfaces:
      web:
        pages: "https://pyautolabs.github.io/PyAutoHeart/"   # self-contained fmt=html board
        step_summary: "fmt=md written to $GITHUB_STEP_SUMMARY by heart-health.yml"
        readme: "verdict badge + auto-updated <!-- heart:begin -->…<!-- heart:end --> block"
      cli_venv:
        command: "pyauto-heart dashboard"
        hook: "heart/shell/heart_prompt.sh (sourceable; prints fmt=oneline on shell/venv open)"
      mobile:
        via: "pyauto-brain health — the Health Agent renders the fmt=json/md card"
    cloud_only_honest: >-
      the cloud job (heart-health.yml) renders with --cloud, marking the
      local-only checks (repo_state, worktree_drift, script_timing, test_run,
      version_skew) as "not observed here" instead of silently green. A dev box
      can enrich the SAME page by rendering without --cloud from its full snapshot.
    gate_role: "none — the dashboard SHOWS health (readiness remains the gate); it never acts on it"
    boundary: >-
      observer-only. Writes only within PyAutoHeart's own repo (gh-pages,
      README, [heart-health] issue), the job step summary, or ~/.pyauto-heart/.
      The venv hook is read-only over cached state.

# GitHub workflows Heart owns (the cloud half of the hybrid CI layer).
workflows:
  - file: .github/workflows/lib-tests.yml
    name: "Library Tests (reusable)"
    role: "reusable unit-test workflow for the 5 libraries (3.12/3.13); each library calls it"
  - file: .github/workflows/heart-health.yml
    name: "Heart Health"
    role: >-
      daily cloud-safe ci_status + open_prs sweep. Publishes the unified health
      dashboard (M5) three ways from the one renderer — GitHub Pages (fmt=html +
      badge.json), $GITHUB_STEP_SUMMARY (fmt=md), and a README verdict badge +
      auto-updated block — and opens/updates a single [heart-health] issue as the
      alerting channel. Cloud-only-honest: renders with --cloud.
  - file: .github/workflows/url-check.yml
    name: "URL Check (central)"
    role: "weekly central URL-hygiene sweep; one consolidated [url-check] issue (monitoring only)"
  - file: .github/workflows/workspace-validation.yml
    name: "Workspace Validation (body)"
    role: >-
      workflow_call-only shared body behind the two channel entries below;
      reuses Build's executor primitives (script_matrix/run_python/
      aggregate_results) unmodified in both modes.
  - file: .github/workflows/workspace-smoke.yml
    name: "Workspace Smoke"
    role: >-
      the CONTINUOUS channel (weekly schedule + bare dispatch → body mode=smoke):
      scripts + notebooks vs current library main, source-shadowed via
      PYTHONPATH; the run history the test_run check + readiness consume.
  - file: .github/workflows/release-integrate.yml
    name: "Release Integrate"
    role: >-
      the REHEARSAL channel (Brain Release Agent dispatch only → body
      mode=release): pip-installs the rehearsed TestPyPI wheels (no source on
      PYTHONPATH) under the `release` env profile, runs verify_install A-F
      against the same wheels, and emits the `release-stage-report` artifact
      `pyauto-heart validate --ingest` consumes. Separate entry so a failed
      rehearsal never overwrites the smoke verdict.

# Operational surface (reporting / triage) the agent can cite in recommendations.
operations:
  dashboard: "pyauto-heart dashboard [--oneline|--md|--html|--json|--badge] [--cloud]   # the unified board"
  status:   "pyauto-heart status [--json] [--quiet]   # full coloured snapshot"
  fix:      "pyauto-heart fix <ci|dirty|drift|timing> [arg]   # emits a Claude remediation bundle"
  daemon:   "pyauto-heart watch|live|tick|stop          # the continuous monitor"
  logs:     "pyauto-heart logs [--tail N] [--follow]"

# Boundary the agent must respect (see pyautobuild_boundary_audit.md).
boundary:
  heart: >-
    owns all health/readiness checks, the release-validation report spec + ingest,
    and the authoritative readiness verdict. Ingest-and-judge only: it NEVER
    dispatches release.yml / workspace-smoke.yml / release-integrate.yml or
    mutates a repo.
  brain_health: "reasons over Heart's outputs (the Health Agent, read-only); owns no checks; never dispatches"
  brain_release: >-
    the Release Agent ORCHESTRATES release validation: dispatches the M1 TestPyPI
    rehearsal + (M3) the wheel integration run, polls, downloads the artifacts,
    hands them to `pyauto-heart validate --ingest`, then consults the Health Agent
    for the verdict. All GitHub dispatch/credentials live here, not in Heart.
  build_hands: "pure executor; runs NO readiness checks; acts only on a GREEN/YELLOW/RED decision"
  call_chain: "Mind -> Release Agent (orchestrate) -> Heart (measure) -> Health Agent (judge) -> Hands/Build (promote on GREEN)"
