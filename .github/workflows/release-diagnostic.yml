name: Release Diagnostic (not validation)

on:
  workflow_dispatch:
    inputs:
      incident:
        description: "Immutable incident to investigate (never release validation)"
        type: choice
        options:
          - "37199991757"
          - "37217670612"
        default: "37199991757"
      repeats:
        description: "Old incident comparison processes (2, 4 or 6); new incident runs one fresh fit"
        type: number
        default: 6

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: ""
      MANIFEST: diagnostics/release-${{ inputs.incident || '37199991757' }}.json
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable manifest and write requirements
        id: manifest
        run: >-
          python3 .github/scripts/release_diagnostic.py prepare
          --manifest "$MANIFEST" --output diagnostic-results
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.manifest.outputs.workspace_repo }}
          ref: ${{ steps.manifest.outputs.workspace_sha }}
          path: diagnostic-workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          ref: ${{ steps.manifest.outputs.hands_sha }}
          path: diagnostic-hands
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.manifest.outputs.python }}
      - name: Install recovered wheel environment and native inspection tools
        run: |
          python -m venv diagnostic-env
          diagnostic-env/bin/python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            --report diagnostic-results/pip-install.json \
            -r diagnostic-results/requirements.txt
          diagnostic-env/bin/python -m pip install py-spy
          echo "$PWD/diagnostic-env/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          # Ephemeral runner only; allow sibling debuggers to attach to Python.
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Install candidate for the original runtime comparison
        if: inputs.incident != '37217670612'
        run: |
          python .github/scripts/release_diagnostic.py prepare --candidate \
            --manifest "$MANIFEST" --output diagnostic-results/candidate-install
          python -m venv diagnostic-candidate
          diagnostic-candidate/bin/python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple \
            --report diagnostic-results/candidate-install/pip-install.json \
            -r diagnostic-results/candidate-install/requirements.txt
      - name: Interleaved runtime comparison against the same release wheels
        if: inputs.incident != '37217670612'
        env:
          REPEATS: ${{ inputs.repeats || 6 }}
        run: >-
          diagnostic-env/bin/python .github/scripts/release_diagnostic.py compare
          --manifest "$MANIFEST" --output diagnostic-results
          --workspace diagnostic-workspace --hands diagnostic-hands
          --candidate-python diagnostic-candidate/bin/python
          --repeats "$REPEATS"
      - name: Capture the current incident in one fresh bounded fit
        if: inputs.incident == '37217670612'
        run: >-
          diagnostic-env/bin/python .github/scripts/release_diagnostic.py run
          --manifest "$MANIFEST" --output diagnostic-results
          --workspace diagnostic-workspace --hands diagnostic-hands
          --repeats 1
      - name: Preserve diagnostic evidence, including failure and native stacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostic-${{ github.run_id }}
          path: |
            diagnostic-results/
            diagnostic-workspace/dataset/multi_dataset/lens_sersic/*.fits
            diagnostic-workspace/dataset/imaging/asymmetric/*.fits
          if-no-files-found: error
