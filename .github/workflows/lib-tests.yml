name: Library Tests (reusable)

# Heart-owned reusable unit-test workflow for the PyAuto libraries
# (Stage 4 Phase A; PyAutoReduce added as the standalone, no-chain member).
# Each library's own .github/workflows/main.yml is now a thin caller:
#
#   jobs:
#     unittest:
#       uses: PyAutoLabs/PyAutoHeart/.github/workflows/lib-tests.yml@main
#       with: { package: autolens }
#       secrets: inherit
#
# The workflow filename is intentionally stable for downstream callers.
#
# PR-time gating is preserved: the caller's `unittest` job runs on push/PR and is
# the required status check. Heart owns the test definition; the library just
# triggers it. Dependency-aware (conf→none, fit/array→conf, galaxy→conf+fit+array,
# lens→all) so lightweight libs don't install the heavy stack. GitHub-hosted +
# pip caching.
#
# The `unittest` job also publishes a `unit-timings-<py>` artifact — pytest's
# junit XML (every test's duration) plus a fresh-process import time — which is
# the standing dataset the Heart's `unit_timings` check ingests daily into the
# board's Unit-test timing and Import timing rows (PyAutoHeart#206).
#
# TWO CACHES ride the `unittest` job, both added as non-fatal steps and both
# keyed on a manual epoch salt (PYAUTO_CACHE_EPOCH) so they can be invalidated
# together, exactly as smoke-tests.yml does it: the JAX persistent compilation
# cache, per (runner OS x python leg x jaxlib), and the numba on-disk function
# cache, per (runner OS x full python version). numba stamps every entry with
# its source file's (mtime, size) — which a fresh clone and a fresh pip install
# both change — so a `Stamp source mtimes from content` step rewrites every
# .py's mtime as a hash of its CONTENT: identical content hits, changed content
# misses, and the numba key therefore needs no library-commit component and can
# safely carry a prefix fallback. Both caches are measured before and after the
# run into `test-results/cache_state.json`, the sidecar that rides the
# unit-timings artifact, so every unit-timing row the Heart ingests can say
# whether the leg ran hot or cold instead of reading a cache landing as a
# speedup and its first invalidation as a regression.

on:
  workflow_call:
    inputs:
      package:
        description: "PyAuto package under test: autonerves|autofit|autoarray|autogalaxy|autolens|autocti|autoreduce"
        required: true
        type: string

jobs:
  unittest:
    runs-on: ubuntu-latest
    # The manual salt carried by every cache key below. Bump it to invalidate
    # every cache at once — a runner-image change, a cache-format change — in
    # one edit instead of hand-editing each key and hoping none was missed.
    env:
      PYAUTO_CACHE_EPOCH: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Map package → repo + dependency chain
        id: map
        run: |
          case "${{ inputs.package }}" in
            autoconf|autonerves)   repo=PyAutoNerves;   deps="" ;;
            autofit)    repo=PyAutoFit;    deps="PyAutoNerves" ;;
            autoarray)  repo=PyAutoArray;  deps="PyAutoNerves" ;;
            autogalaxy) repo=PyAutoGalaxy; deps="PyAutoNerves PyAutoFit PyAutoArray" ;;
            autolens)   repo=PyAutoLens;   deps="PyAutoNerves PyAutoFit PyAutoArray PyAutoGalaxy" ;;
            autocti)    repo=PyAutoCTI;    deps="PyAutoNerves PyAutoFit PyAutoArray" ;;
            autoreduce) repo=PyAutoReduce; deps="" ;;
            *) echo "::error::unknown package '${{ inputs.package }}'"; exit 1 ;;
          esac
          # autoreduce is standalone (never imports the PyAuto* stack) and names
          # its test extra [test]; the five stack libraries use [optional].
          extras=optional
          if [ "${{ inputs.package }}" = "autoreduce" ]; then extras=test; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "extras=$extras" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.map.outputs.repo }} (repo under test, at the PR ref)
        uses: actions/checkout@v4
        with:
          path: ${{ steps.map.outputs.repo }}

      - name: Clone dependency libraries (matching branch if it exists)
        run: |
          set -e
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for dep in ${{ steps.map.outputs.deps }}; do
            git clone "https://github.com/PyAutoLabs/$dep" "$dep"
            if git -C "$dep" ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "Branch $BRANCH exists in $dep — checking it out"
              git -C "$dep" checkout "$BRANCH"
            fi
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The canonical arcticpy install for the whole organism, including its
      # version pin, lives in the action — not in this file and not in any
      # consumer repo. Referenced at @main rather than by local path because
      # this is a REUSABLE workflow: it runs in the caller's context.
      - name: Install arcticpy (autocti only — source-only C++ sdist)
        if: ${{ inputs.package == 'autocti' }}
        uses: PyAutoLabs/PyAutoHeart/.github/actions/install-arcticpy@main

      - name: Install (deps + package from source, [optional] extras)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest coverage pytest-cov
          for r in ${{ steps.map.outputs.deps }} ${{ steps.map.outputs.repo }}; do
            pip install "./$r[${{ steps.map.outputs.extras }}]"
          done

      - name: Resolve cache keys
        # Two components, each one a thing that MUST invalidate a cache:
        #   jaxlib — a cached compilation is a jaxlib-specific artefact, so a
        #     jaxlib bump must never read the previous wheel's entries;
        #   pyfull — the FULL python version, because numba keys every cache
        #     entry on the directory its source was found in and the
        #     site-packages path carries the patch version.
        # No chain hash here, unlike smoke-tests.yml: this workflow has no
        # dataset cache, and the content-stamp two steps down makes a library
        # commit invalidate exactly the numba entries it changed.
        # Non-fatal like every step the caches added: an unresolvable key
        # degrades to a cache miss, never to a red gate.
        id: keys
        continue-on-error: true
        run: |
          jaxlib="$(python -c 'import jaxlib; print(jaxlib.__version__)' 2>/dev/null || echo nojax)"
          pyfull="$(python -c 'import sys; print(sys.version.split()[0])')"
          {
            echo "jaxlib=${jaxlib:-nojax}"
            echo "pyfull=$pyfull"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compile cache
        # The run-id suffix makes every save a fresh SUPERSET of what was
        # restored (the accumulating-cache pattern): the exact key never hits,
        # the restore-keys prefix takes the newest previous entry, and the save
        # writes the merged directory back under a new key. Traced code that
        # changed simply misses its own entries and recompiles them, so this
        # cache needs no invalidation rule of its own. And a PR run reads the
        # default branch's caches under GitHub's cache scoping — which is
        # exactly what a contributor wants: a first push that is already warm.
        uses: actions/cache/restore@v4
        id: jax-cache
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.pyauto_jax_cache
          key: pyauto-jax-${{ runner.os }}-py${{ matrix.python-version }}-jaxlib${{ steps.keys.outputs.jaxlib }}-e${{ env.PYAUTO_CACHE_EPOCH }}-${{ github.run_id }}
          restore-keys: |
            pyauto-jax-${{ runner.os }}-py${{ matrix.python-version }}-jaxlib${{ steps.keys.outputs.jaxlib }}-e${{ env.PYAUTO_CACHE_EPOCH }}-

      - name: Restore the numba cache
        # Same accumulating pattern as the compile cache above, and the prefix
        # fallback is SAFE for the reason the stamp step below exists: a numba
        # entry carries its source file's (mtime, size), the stamp makes that
        # mtime a function of the file's content, so a changed file misses its
        # own entry however old the restored directory is. That is why this key
        # names no library commit — and a numba version bump invalidates its own
        # index format on its own terms.
        uses: actions/cache/restore@v4
        id: numba-cache
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.numba_cache
          key: pyauto-numba-${{ runner.os }}-py${{ steps.keys.outputs.pyfull }}-e${{ env.PYAUTO_CACHE_EPOCH }}-${{ github.run_id }}
          restore-keys: |
            pyauto-numba-${{ runner.os }}-py${{ steps.keys.outputs.pyfull }}-e${{ env.PYAUTO_CACHE_EPOCH }}-

      - name: Stamp source mtimes from content
        # numba stamps every cache entry with its source file's
        # (st_mtime, st_size) and stores it under a directory named for the
        # source's own directory. A fresh clone and a fresh `pip install` both
        # give every .py a brand-new mtime, so a restored cache would miss
        # EVERY entry it holds — the cache would cost upload time and buy
        # nothing. This step rewrites each mtime as a function of the file's
        # CONTENT, so an unchanged file stamps identically on every runner and
        # a changed one stamps differently: exactly the invalidation numba
        # wants, expressed in the one field it already checks.
        #
        # Non-fatal like the rest: a file we could not stat or touch costs one
        # cache entry, never the gate.
        id: stamp
        continue-on-error: true
        env:
          # Via env, never interpolated into the script body — the same house
          # rule the key resolver above and the recorder below follow.
          STAMP_DIRS: ${{ steps.map.outputs.repo }} ${{ steps.map.outputs.deps }}
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import os
          import pathlib

          # The cloned checkouts first: `Run tests` puts them on PYTHONPATH, so
          # they are the copies the suite actually imports.
          roots = [pathlib.Path(d) for d in os.environ.get("STAMP_DIRS", "").split()]
          # ...and the INSTALLED copies beside them, which is what a leg with no
          # matching branch imports. `find_spec` on a top-level name resolves it
          # WITHOUT importing it, so a package that is not installed here simply
          # drops out instead of raising.
          for pkg in ("autonerves", "autofit", "autoarray", "autogalaxy",
                      "autolens", "autocti", "autoreduce"):
              try:
                  spec = importlib.util.find_spec(pkg)
              except (ImportError, ValueError):
                  continue
              if spec is None:
                  continue
              roots.extend(pathlib.Path(p)
                           for p in (spec.submodule_search_locations or []))

          stamped = 0
          for root in roots:
              if not root.is_dir():
                  continue
              for path in root.rglob("*.py"):
                  try:
                      digest = hashlib.sha1(path.read_bytes()).digest()
                      mtime = 1_000_000_000 + int.from_bytes(digest[:4], "big")
                      os.utime(path, (mtime, mtime))
                  except OSError:
                      continue
                  stamped += 1
          print(f"stamped {stamped} source files under {len(roots)} roots")
          PY

      - name: Measure the caches before the run
        # The "before" half of the sidecar: what a restore actually put on disk,
        # as against what the run leaves behind. A missing path measures as
        # zero rather than failing — a cold cache is a measurement, not a fault.
        id: cache-before
        continue-on-error: true
        env:
          JAX_PATH: ${{ github.workspace }}/.pyauto_jax_cache
          NUMBA_PATH: ${{ github.workspace }}/.numba_cache
        run: |
          measure() {
            mb="$(du -sm "$1" 2>/dev/null | cut -f1)"
            n="$(find "$1" -type f 2>/dev/null | wc -l)"
            echo "${mb:-0} ${n:-0}"
          }
          set -- $(measure "$JAX_PATH")
          jax_mb="$1"; jax_n="$2"
          set -- $(measure "$NUMBA_PATH")
          numba_mb="$1"; numba_n="$2"
          {
            echo "jax_mb=$jax_mb"
            echo "jax_n=$jax_n"
            echo "numba_mb=$numba_mb"
            echo "numba_n=$numba_n"
          } >> "$GITHUB_OUTPUT"

      # The cold import cost the developer loop actually pays: a FRESH process
      # importing the package once, not the warm in-process cost a test session
      # amortises over hundreds of tests. Measured here rather than inferred
      # from the suite's wall-clock, which is dominated by the tests.
      #
      # `seconds: null` when the import failed or timed out — never a
      # fabricated 0, which in a timing dataset would read as an instant import
      # rather than as no measurement at all. The returncode travels with it so
      # the ingest can say WHY there is no number.
      #
      # continue-on-error: this is a dataset, not a gate. A package that cannot
      # be imported will fail the suite two steps down on its own merits; it
      # must never be this step that reds six libraries' required check.
      - name: Time a fresh-process import (unit-timings dataset)
        continue-on-error: true
        working-directory: ${{ steps.map.outputs.repo }}
        env:
          # The package name reaches Python through the ENVIRONMENT, never
          # interpolated into the source: a `${{ }}` expansion inside the
          # heredoc would be substituted before python ever parsed the line.
          PKG: ${{ inputs.package }}
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, subprocess, sys, time

          pkg = os.environ["PKG"]
          seconds = None
          returncode = None
          start = time.perf_counter()
          try:
              proc = subprocess.run(
                  [sys.executable, "-c", f"import {pkg}"],
                  capture_output=True, timeout=600,
              )
          except subprocess.TimeoutExpired:
              # No number, and no returncode either: the process never finished.
              pass
          else:
              returncode = proc.returncode
              if proc.returncode == 0:
                  seconds = round(time.perf_counter() - start, 3)
              else:
                  sys.stderr.write(proc.stderr.decode("utf-8", "replace")[-2000:])

          out = pathlib.Path("test-results")
          out.mkdir(parents=True, exist_ok=True)
          (out / "import_time.json").write_text(json.dumps({
              "schema": "import_time/1",
              "package": pkg,
              "python": "%d.%d" % sys.version_info[:2],
              "seconds": seconds,
              "returncode": returncode,
              "ts": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, sort_keys=True) + "\n")
          print(f"import {pkg}: {seconds}s (returncode {returncode})")
          PY

      - name: Run tests
        env:
          # autonerves defaults the JAX cache to ~/.cache/pyauto_jax when it is
          # unset; an explicit workspace path is the one the cache steps above
          # and below can name. NUMBA_CACHE_DIR likewise moves numba's on-disk
          # function cache out of the source trees (where it would be neither
          # restorable nor saveable) into the one directory those steps cache.
          JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.pyauto_jax_cache
          # Persist EVERY compile, not only those over JAX's 1.0s default
          # (autonerves setdefaults the same 1s whenever the cache dir is set;
          # a preset value wins). Same reasoning and same knob as the smoke
          # leg (PyAutoHeart#221): a unit suite is many small compiles, so
          # under the 1s regime the restored cache holds almost nothing and
          # every run re-pays them. The price is cache-artefact size; the way
          # out is this one line, or an epoch bump to drop the fat caches.
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
          NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
        run: |
          export JAX_ENABLE_X64=True
          ROOT="$(pwd)"
          for r in ${{ steps.map.outputs.deps }} ${{ steps.map.outputs.repo }}; do
            export PYTHONPATH="$PYTHONPATH:$ROOT/$r"
          done
          pushd "${{ steps.map.outputs.repo }}"
          # --junitxml is pytest's BUILT-IN machine-readable per-test record:
          # one <testcase> per test with `time` = setup+call+teardown. That is
          # why not `--durations`, which is a console tail of the slowest N that
          # has to be scraped out of a log that expires with the run.
          pytest --cov ${{ inputs.package }} --cov-report xml:coverage.xml \
                 --junitxml=test-results/junit.xml

      - name: Record cache state (rides the unit-timings artifact)
        # This file is the unit of measurement for the whole cache story: every
        # unit-timing row the Heart ingests from the artifact below can then say
        # whether that leg ran hot or cold. Without it a timing dataset reads a
        # cache landing as a speedup and its invalidation as a regression, and
        # neither is a change anybody made.
        #
        # if: always() — a red run's cache state is exactly as interesting as a
        # green one's, and the artifact is uploaded either way.
        #
        # Two sections, not smoke-tests.yml's three: there is no dataset cache
        # in this workflow, so there is nothing honest to say under `datasets`.
        id: cache-state
        if: always()
        continue-on-error: true
        env:
          EPOCH: ${{ env.PYAUTO_CACHE_EPOCH }}
          OUT_DIR: ${{ steps.map.outputs.repo }}/test-results
          JAX_PATH: ${{ github.workspace }}/.pyauto_jax_cache
          JAX_KEY_RESTORED: ${{ steps.jax-cache.outputs.cache-matched-key }}
          JAX_EXACT: ${{ steps.jax-cache.outputs.cache-hit }}
          JAX_MB_BEFORE: ${{ steps.cache-before.outputs.jax_mb }}
          JAX_N_BEFORE: ${{ steps.cache-before.outputs.jax_n }}
          NUMBA_PATH: ${{ github.workspace }}/.numba_cache
          NUMBA_KEY_RESTORED: ${{ steps.numba-cache.outputs.cache-matched-key }}
          NUMBA_EXACT: ${{ steps.numba-cache.outputs.cache-hit }}
          NUMBA_MB_BEFORE: ${{ steps.cache-before.outputs.numba_mb }}
          NUMBA_N_BEFORE: ${{ steps.cache-before.outputs.numba_n }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path


          def as_int(text):
              try:
                  return int(str(text).strip())
              except (TypeError, ValueError):
                  return 0


          def measure(path):
              """(size in MiB, file count) for a path that may not exist."""
              if not path or not os.path.isdir(path):
                  return 0, 0
              proc = subprocess.run(["du", "-sm", path], capture_output=True,
                                    text=True)
              head = proc.stdout.split()
              size = as_int(head[0]) if head else 0
              return size, sum(len(files) for _r, _d, files in os.walk(path))


          def section(path, key, exact, mb_before, n_before):
              mb_after, n_after = measure(path)
              mb_before, n_before = as_int(mb_before), as_int(n_before)
              return {
                  "path": path,
                  # A restored key at all is a hit; the EXACT key is the
                  # accumulating pattern's never-case, kept separate so a
                  # reader is not left guessing which one "hit" meant.
                  "restored_key": key,
                  "hit": bool(key),
                  "exact": exact == "true",
                  "size_mb_before": mb_before,
                  "size_mb_after": mb_after,
                  "entries_before": n_before,
                  "entries_after": n_after,
              }, (mb_after != mb_before or n_after != n_before)


          env = os.environ.get
          jax, jax_changed = section(
              env("JAX_PATH", ""), env("JAX_KEY_RESTORED", ""),
              env("JAX_EXACT", ""), env("JAX_MB_BEFORE", ""),
              env("JAX_N_BEFORE", ""),
          )
          numba, numba_changed = section(
              env("NUMBA_PATH", ""), env("NUMBA_KEY_RESTORED", ""),
              env("NUMBA_EXACT", ""), env("NUMBA_MB_BEFORE", ""),
              env("NUMBA_N_BEFORE", ""),
          )
          payload = {
              "schema": "cache_state/1",
              "epoch": env("EPOCH", ""),
              "jax": jax,
              "numba": numba,
          }
          out = Path(env("OUT_DIR", "test-results"))
          out.mkdir(parents=True, exist_ok=True)
          (out / "cache_state.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n")
          print(json.dumps(payload, sort_keys=True))

          github_output = env("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as handle:
                  handle.write("jax_changed=%s\n"
                               % ("true" if jax_changed else "false"))
                  handle.write("numba_changed=%s\n"
                               % ("true" if numba_changed else "false"))
          PY

      # The standing dataset the Heart's `unit_timings` check ingests: per-test
      # durations from the junit XML plus the fresh-process import time above.
      # In the job log that data evaporates with the log retention and is only
      # recovered by hand-scraping; as an artifact it becomes a record the board
      # can compare run to run, across every library at once.
      #
      # if: always() + if-no-files-found: ignore are both load-bearing, exactly
      # as in smoke-tests.yml. A red suite still wrote its junit XML and those
      # timings are worth keeping; a leg that died before the first write (a
      # failed install) leaves no test-results/ at all, and an upload that
      # failed closed would turn "we collected no timings" into "the PR is red",
      # which is backwards. No retention-days: the dataset is the point, so it
      # keeps the repo's full default artifact retention.
      - name: Upload the unit timings (per-test durations + import time)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-timings-${{ matrix.python-version }}
          path: ${{ steps.map.outputs.repo }}/test-results/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ${{ steps.map.outputs.repo }}/coverage.xml
          fail_ci_if_error: false

      - name: Save the JAX compile cache
        # Saved even on a RED run: a compilation-cache entry is complete or
        # absent, never half-written, so the compiling a failing run did is
        # still worth keeping for the next attempt. The `jax_changed` guard is
        # the no-op case — an unchanged cache is not re-uploaded under a new key.
        if: always() && steps.cache-state.outputs.jax_changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.pyauto_jax_cache
          key: pyauto-jax-${{ runner.os }}-py${{ matrix.python-version }}-jaxlib${{ steps.keys.outputs.jaxlib }}-e${{ env.PYAUTO_CACHE_EPOCH }}-${{ github.run_id }}

      - name: Save the numba cache
        # Saved on a red run for the same reason: a numba cache entry is an
        # index line plus a complete compiled artefact, or it is absent. Same
        # no-op guard as above.
        if: always() && steps.cache-state.outputs.numba_changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.numba_cache
          key: pyauto-numba-${{ runner.os }}-py${{ steps.keys.outputs.pyfull }}-e${{ env.PYAUTO_CACHE_EPOCH }}-${{ github.run_id }}

      - name: Slack on failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.21.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          channel-id: C03S98FEDK2
          payload: |
            {
              "text": "${{ github.repository }}/${{ github.ref_name }} (Python ${{ matrix.python-version }}) build result: ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  # JAX is a default dependency of the stack (PyAutoLens#702), so every
  # ordinary environment — including the [optional] install above — has jax
  # importable. The NumPy-only path remains fully supported (Intel macOS
  # resolves to it via environment markers; unit tests are NumPy-only by
  # policy) but before this job NOTHING exercised the jax-NOT-INSTALLED
  # environment. This leg installs normally, strips the jax package family,
  # and re-runs the suite: it proves every module imports and the NumPy path
  # passes with jax genuinely absent. One Python version only — the jax-absent
  # surface does not vary across minors.
  unittest-nojax:
    if: ${{ inputs.package != 'autoreduce' }}
    runs-on: ubuntu-latest
    steps:
      - name: Map package → repo + dependency chain
        id: map
        run: |
          case "${{ inputs.package }}" in
            autoconf|autonerves)   repo=PyAutoNerves;   deps="" ;;
            autofit)    repo=PyAutoFit;    deps="PyAutoNerves" ;;
            autoarray)  repo=PyAutoArray;  deps="PyAutoNerves" ;;
            autogalaxy) repo=PyAutoGalaxy; deps="PyAutoNerves PyAutoFit PyAutoArray" ;;
            autolens)   repo=PyAutoLens;   deps="PyAutoNerves PyAutoFit PyAutoArray PyAutoGalaxy" ;;
            autocti)    repo=PyAutoCTI;    deps="PyAutoNerves PyAutoFit PyAutoArray" ;;
            *) echo "::error::unknown package '${{ inputs.package }}'"; exit 1 ;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ steps.map.outputs.repo }} (repo under test, at the PR ref)
        uses: actions/checkout@v4
        with:
          path: ${{ steps.map.outputs.repo }}

      - name: Clone dependency libraries (matching branch if it exists)
        run: |
          set -e
          BRANCH="${{ github.head_ref || github.ref_name }}"
          for dep in ${{ steps.map.outputs.deps }}; do
            git clone "https://github.com/PyAutoLabs/$dep" "$dep"
            if git -C "$dep" ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "Branch $BRANCH exists in $dep — checking it out"
              git -C "$dep" checkout "$BRANCH"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The canonical arcticpy install for the whole organism, including its
      # version pin, lives in the action — not in this file and not in any
      # consumer repo. Referenced at @main rather than by local path because
      # this is a REUSABLE workflow: it runs in the caller's context.
      - name: Install arcticpy (autocti only — source-only C++ sdist)
        if: ${{ inputs.package == 'autocti' }}
        uses: PyAutoLabs/PyAutoHeart/.github/actions/install-arcticpy@main

      - name: Install ([optional] extras), then strip the jax package family
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest coverage pytest-cov
          for r in ${{ steps.map.outputs.deps }} ${{ steps.map.outputs.repo }}; do
            pip install "./$r[optional]"
          done
          # Everything that is jax or imports jax at its own import time.
          # Missing entries are skipped by pip with a warning, not an error.
          pip uninstall -y jax jaxlib jaxnnls optax chex jax_zero_contour \
            blackjax nufftax tfp-nightly
          # Guard the guard: fail loudly here if jax somehow survives, rather
          # than green-running a suite that never tested the jax-absent path.
          python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('jax') else 0)"

      - name: Run tests (jax absent)
        run: |
          ROOT="$(pwd)"
          for r in ${{ steps.map.outputs.deps }} ${{ steps.map.outputs.repo }}; do
            export PYTHONPATH="$PYTHONPATH:$ROOT/$r"
          done
          pushd "${{ steps.map.outputs.repo }}"
          pytest

      - name: Slack on failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@v1.21.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          channel-id: C03S98FEDK2
          payload: |
            {
              "text": "${{ github.repository }}/${{ github.ref_name }} (no-jax leg) build result: ${{ job.status }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
