name: Heart Health

# The cloud half of the PyAutoHeart hybrid CI layer, extended in M5 to publish
# the ONE unified health dashboard (heart/dashboard.py) alongside the existing
# alerting.
#
# It runs the five checks that need only the GitHub API (no local working tree) —
# CI status, open PRs, CI wall-clock timing, the NO_RUN census and the
# per-script smoke timings — across every polled repo, then:
#   1. renders the unified board (one renderer, many formats) and publishes it
#      three ways, all from the SAME snapshot so they cannot disagree:
#        * GitHub Pages   — self-contained fmt="html" + a shields badge.json
#        * step summary    — fmt="md" into $GITHUB_STEP_SUMMARY (zero hosting)
#        * README          — a shields verdict badge + an auto-updated
#                            <!-- heart:begin -->…<!-- heart:end --> md block
#      and commits, beside that block, the day's lines of the PERMANENT timing
#      record (timings/gates.jsonl + timings/scripts/<repo>.jsonl). This job is
#      the record's single writer; the two timing checks read it back as the
#      first source for their baselines, with the published board.json only as
#      the fallback, so a Pages gap no longer loses history.
#   2. opens-or-updates a single "[heart-health]" tracking ISSUE when anything
#      is red/degraded and closes it when clean — the ALERTING channel (kept).
#
# Cloud-only-honest: the cloud job has no working tree, so the board renders
# with --cloud, which marks the local-only checks (repo_state, worktree_drift,
# script_timing, test_run, version_skew) as "not observed here" rather than
# silently green. A dev box can enrich the SAME page by pushing a full snapshot
# rendered without --cloud — never a second, competing page.
#
# Observer boundary: everything here writes ONLY within PyAutoHeart's own repo
# (its gh-pages, its README, its [heart-health] issue), the job step summary, or
# the job workspace. No foreign repo, no build/workflow dispatch, no secret
# beyond the auto-provisioned GITHUB_TOKEN.

on:
  schedule:
    # Daily 05:00 UTC — one hour ahead of PyAutoMind's morning_health message
    # (06:00 UTC), which reads this run's verdict (moved from 06:00 for that).
    - cron: "0 5 * * *"
  workflow_dispatch:

# contents: write  → commit the README badge/block into Heart's OWN README
# issues:   write  → the [heart-health] tracking issue
# pages/id-token   → publish the Pages board
# actions:  read   → list and download workflow artifacts (smoke_timings). The
#                    artifact endpoints need this scope even for the repo's own
#                    artifacts, and the default token grant does not include it.
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: read

# Never let two runs publish Pages at once. cancel-in-progress is false so a
# newer run QUEUES behind an in-progress one rather than cancelling it — we don't
# want to abort a publish/deploy mid-flight (the GitHub Pages-recommended
# setting); the queued run then publishes the newer snapshot.
concurrency:
  group: heart-health-pages
  cancel-in-progress: false

env:
  HEART_STATE_DIR: ${{ github.workspace }}/.heart-state
  NO_COLOR: "1"

jobs:
  heart-health:
    name: Cloud health checks + dashboard
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.classify.outputs.status }}
    steps:
      - name: Checkout PyAutoHeart
        uses: actions/checkout@v4

      # The shared board look the dashboard renders with — imported from the
      # Brain, never copied here.
      - name: Checkout PyAutoBrain (the shared board theme)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run cloud-safe checks (ci_status, open_prs, ci_timing, no_run_census, smoke_timings)
        env:
          # The repo-scoped GITHUB_TOKEN is enough for every check here except
          # the artifact /zip downloads smoke_timings makes against OTHER repos:
          # actions/download-artifact documents a cross-repo download as needing
          # a token with actions:read ON THAT REPO, and the default token has no
          # standing there — the endpoint answers 403. The check records that
          # per repo as an honest error rather than a quiet-looking empty
          # result, and the remedy is a secret, never a code change: a
          # fine-grained PAT (Actions: read on the workspace repos) stored as
          # HEART_TIMINGS_TOKEN. Absent that secret this falls back to the
          # auto-provisioned token and Heart's own artifacts still ingest.
          GH_TOKEN: ${{ secrets.HEART_TIMINGS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Five API-only checks: CI conclusions and open PRs (health), then CI
          # wall-clock, the NO_RUN census and the per-script smoke timings (the
          # ⏱ performance surface). ci_timing's and smoke_timings' aggregate
          # steps re-read the board.json published by the previous run to carry
          # their own history/previous observation forward; a fetch failure
          # there costs a sparkline or a comparison, never the render. `set +e`
          # keeps a single broken check from aborting the board.
          set +e
          bash heart/checks/ci_status.sh
          bash heart/checks/open_prs.sh
          bash heart/checks/ci_timing.sh
          bash heart/checks/no_run_census.sh
          bash heart/checks/smoke_timings.sh
          exit 0

      - name: Append today's observations to the timing record
        run: |
          # ORDERING: after the checks, before the render. The checks' aggregate
          # passes have already READ the record for their baselines, and neither
          # can be fooled by today's own line — ci_timing's `history_baseline`
          # excludes today's date, and smoke_timings compares by run id and
          # refuses to compare a run against itself. So appending here is safe,
          # and it lets the render census a record that already includes today.
          #
          # SINGLE WRITER: only this workflow appends. The record is committed
          # into this repo (below, beside the README block), and two writers on
          # an append-only file in git is a merge conflict waiting for a human —
          # a dev-box tick never appends.
          #
          # A missing rollup means "nothing to append from that slice", never an
          # error: this exits 0 whatever the checks managed to produce.
          PYTHONPATH="$PWD" python -m heart.timings append \
            --ci-timing "$HEART_STATE_DIR/ci_timing.json" \
            --smoke-timings "$HEART_STATE_DIR/smoke_timings.json"

      - name: Aggregate snapshot + compute readiness verdict
        run: |
          # Fold the per-repo sidecars into state.json, then compute the
          # authoritative verdict into release_ready.json. Both are pure
          # projections of what the cloud observed — no recompute in the board.
          PYTHONPATH="$PWD" python -c "from heart import state; state.aggregate()"
          PYTHONPATH="$PWD" python -c "from heart import readiness; readiness.run()"

      - name: Render the unified board (html / badge / md)
        run: |
          mkdir -p _site
          # --cloud marks the local-only checks as "not observed here"; every
          # file below is a projection of the same snapshot + verdict. A
          # committed state/devbox_board.json (pyauto-heart publish) is
          # auto-detected and fills the unobserved rows, age-stamped.
          PYTHONPATH="$PWD" python -m heart.dashboard --cloud --html     > _site/index.html
          PYTHONPATH="$PWD" python -m heart.dashboard --cloud --badge    > _site/badge.json
          # The machine surface, published beside the badge so sibling boards
          # (the Brain's morning board) can render the structured blockers —
          # each already carrying its own /bug prompt — without re-deriving
          # anything (schema v2; the same JSON the Health Agent consumes).
          PYTHONPATH="$PWD" python -m heart.dashboard --cloud --json     > _site/board.json
          PYTHONPATH="$PWD" python -m heart.dashboard --cloud --md       > board.md
          cp board.md _site/dashboard.md
          # The README carries only the brief strip; the full board lives on
          # the Pages page (one-tap 📋 fix prompts) and the step summary.
          PYTHONPATH="$PWD" python -m heart.dashboard --cloud --md-brief > readme_strip.md

      - name: Write the board to the job step summary
        run: |
          {
            cat board.md
            echo ""
            echo "_Published board: https://pyautolabs.github.io/PyAutoHeart/_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the README block + today's timing record (own repo only, main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import pathlib, re
          readme = pathlib.Path("README.md")
          text = readme.read_text()
          board = pathlib.Path("readme_strip.md").read_text().strip()
          begin, end = "<!-- heart:begin -->", "<!-- heart:end -->"
          block = f"{begin}\n{board}\n{end}"
          if begin in text and end in text:
              text = re.sub(re.escape(begin) + r".*?" + re.escape(end), block,
                            text, flags=re.DOTALL)
          else:
              # First run: insert the block just after the H1 title line.
              lines = text.splitlines()
              for i, ln in enumerate(lines):
                  if ln.startswith("# "):
                      lines.insert(i + 1, "\n" + block + "\n")
                      break
              text = "\n".join(lines)
          readme.write_text(text)
          PY
          # `git status --porcelain` rather than `git diff --quiet`, because
          # the record's first line for a repo creates an UNTRACKED file, which
          # a diff of the working tree cannot see. One commit a day carries both
          # the README block and the day's appended lines.
          if [ -n "$(git status --porcelain README.md timings/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md timings/
            git commit -m "docs(heart): daily board block + timing record [skip ci]"
            git push
          else
            echo "README health block and timing record unchanged — nothing to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Classify results (alerting channel)
        id: classify
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          state = pathlib.Path(os.environ["HEART_STATE_DIR"]) / "per-repo"
          red, yellow = [], []
          for f in sorted(state.glob("*.ci_status.json")):
              d = json.loads(f.read_text())
              if d.get("conclusion") not in (None, "", "success"):
                  line = f"- **{d['name']}**: CI {d.get('conclusion')} ({d.get('workflow','?')})"
                  if d.get("url"):
                      line += f" — [failing run]({d['url']})"
                  red.append(line)
          for f in sorted(state.glob("*.open_prs.json")):
              d = json.loads(f.read_text())
              age = d.get("max_age_days", 0)
              if d.get("open_count", 0) and age >= 30:
                  red.append(f"- **{d['name']}**: open PR {age}d old (>30d)")
              elif d.get("open_count", 0) and age >= 7:
                  yellow.append(f"- {d['name']}: open PR {age}d old")
          lines = ["# Heart health report", "",
                   "Board: https://pyautolabs.github.io/PyAutoHeart/", ""]
          if red:
              lines += ["## 🔴 Red", *red, ""]
          if yellow:
              lines += ["## 🟡 Yellow", *yellow, ""]
          if not red and not yellow:
              lines += ["✅ All cloud checks green (CI passing, no stale PRs)."]
          body = "\n".join(lines)
          pathlib.Path("/tmp/heart_health_body.md").write_text(body + "\n")
          status = "red" if red else ("yellow" if yellow else "green")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"status={status}\n")
          print(body)
          PY

      - name: Open or update [heart-health] tracking issue
        if: steps.classify.outputs.status != 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --search '"[heart-health]"' --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/heart_health_body.md
          else
            gh issue create \
              --title "[heart-health] Degraded ecosystem health" \
              --body-file /tmp/heart_health_body.md \
              --label heart-health 2>/dev/null \
              || gh issue create \
                --title "[heart-health] Degraded ecosystem health" \
                --body-file /tmp/heart_health_body.md
          fi

      - name: Close [heart-health] issue when clean
        if: steps.classify.outputs.status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --search '"[heart-health]"' --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Cloud health checks are green — closing automatically."
          done

  deploy-pages:
    name: Publish the board to GitHub Pages
    needs: heart-health
    runs-on: ubuntu-latest
    # Only publish from the canonical branch; branch dispatches still render +
    # upload the artifact above, they just don't deploy it live.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
