name: Workspace Validation

# Heart-owned workspace-integration validation (Stage 4 Phase B). M3 of the
# Brain->Health->Heart release-validation redesign gives it two modes:
#
#   mode=smoke (entry: workspace-smoke.yml)
#     Runs every workspace's scripts AND generated notebooks against the
#     CURRENT source `main` of the 5 libraries (source-shadowed via PYTHONPATH,
#     under the `smoke` env profile — config/build/profile_smoke.yaml).
#     This is the continuous readiness signal / weekly sweep;
#     `test_run`/`readiness` read the smoke channel's conclusion.
#
#   mode=release (entry: release-integrate.yml — Brain Release Agent dispatch
#     only, after an M1 TestPyPI rehearsal on release.yml)
#     Re-points the SAME script matrix at the rehearsed TestPyPI wheels:
#     `pip install` the 5 libraries pinned at `testpypi_version` — NO library
#     source on PYTHONPATH (closes assessment Gap A: the smoke path shadows the
#     packages with source checkouts, so it never touches a wheel). Scripts
#     still run FROM WITHIN each workspace checkout so autonerves resolves the
#     workspace's own config/ + dataset/, not the wheel's packaged defaults
#     (closes Gap 4). Uses the `release` env profile — each workspace/
#     workspace_test repo's config/build/profile_release.yaml — which is
#     PYAUTO_TEST_MODE=1 (reduced, real sampler) + SMALL_DATASETS=1 +
#     FAST_PLOTS=1 for user workspaces, PYAUTO_TEST_MODE=0 (real searches,
#     each script's own n_like_max caps) + full-res + real plots for
#     *_workspace_test (closes Gap B; see PyAutoHeart/docs/release_validation.md
#     for the full table). Also runs `verify_install` A-F against the same
#     wheels, and emits a `{"stage": "integrate", ...}` report
#     `pyauto-heart validate --ingest` understands. Skips notebook execution —
#     out of scope for M3, scripts are the release-validation surface.
#
# Run mechanics (script_matrix.py / run_python.py / aggregate_results.py) are
# Build's executor primitives — checked out from PyAutoHands, not duplicated,
# in EITHER mode. Heart's own code (heart/checks/verify_install.sh,
# heart/validate.py) is checked out from THIS repo (default actions/checkout).
#
# Triggers: workflow_call ONLY — this file is the shared body behind two thin
# entry workflows, one per meaning:
#
#   workspace-smoke.yml     schedule + bare dispatch → mode=smoke
#   release-integrate.yml   dispatch + workflow_call → mode=release
#
# The split exists because `gh run list --workflow <file>` cannot filter on
# dispatch inputs: when both meanings shared one file, a failed nightly
# release rehearsal became the "latest run" and overwrote the continuous
# smoke verdict Heart's test_run leg reads. Runs are attributed to the CALLER
# workflow, so each channel's history is unambiguous. Heavy, so never in the
# <30s heart tick.
#
# Boundary: this workflow only executes what it's told (mode/version/shas come
# in as inputs). Dispatching it, polling it, and feeding its artifacts to
# `pyauto-heart validate --ingest` is the Brain Release Agent's job — Heart
# itself never dispatches a workflow or talks to GitHub's API.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: smoke
      testpypi_version:
        type: string
        default: ""
      commit_shas:
        type: string
        default: "{}"

permissions:
  contents: read

env:
  # Workspace pins lag the libraries' source __version__ between releases;
  # without this every script fails fast with WorkspaceVersionMismatchError.
  # Same bypass run_scripts uses in release.yml. mode=release also carries this
  # in profile_release.yaml (the TestPyPI dev version never matches the
  # workspace pin either) — belt and braces.
  PYAUTO_SKIP_WORKSPACE_VERSION_CHECK: "1"
  # JAX filters its own frames out of a traceback by default, and in practice
  # takes the exception that names the failure with them — a failing script then
  # reports only "For simplicity, JAX has removed its internal frames...". Run
  # 30516167217 (2026-07-30) failed both interferometer shards with exactly that
  # and nothing else; the real cause (a RESOURCE_EXHAUSTED OOM) was only legible
  # the next night, in 30607596240, when the message happened to survive. A gate
  # whose error messages are filtered away is the PyAutoBrain#196 exit-code
  # problem again: the signal exists and the harness discards it before a human
  # sees it. Set at workflow level so both the smoke and release legs, and every
  # project in the matrix, are covered — run_python.py's per-script env profiles
  # inherit it, since a profile only *sets* the keys it is given.
  JAX_TRACEBACK_FILTERING: "off"

jobs:
  find_scripts:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.script_matrix.outputs.matrix }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      # Resolved once here (rather than read from `inputs.mode` directly in
      # every downstream `if:`) so every mode check routes through one job
      # output; the entry workflows always pass mode explicitly, and a bare
      # input still resolves to plain "smoke", never an empty string.
      - name: Resolve mode
        id: mode
        env:
          MODE_INPUT: ${{ inputs.mode }}
        run: echo "mode=${MODE_INPUT:-smoke}" >> "$GITHUB_OUTPUT"
      - name: Checkout PyAutoHands (run primitives)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Clone workspaces (paths match script_matrix project names)
        run: |
          set -e
          declare -A WS=(
            [autofit]=autofit_workspace [autogalaxy]=autogalaxy_workspace [autolens]=autolens_workspace
            [autofit_test]=autofit_workspace_test [autogalaxy_test]=autogalaxy_workspace_test
            [autolens_test]=autolens_workspace_test
            [howtogalaxy]=HowToGalaxy [howtolens]=HowToLens [howtofit]=HowToFit
          )
          for proj in "${!WS[@]}"; do
            git clone --depth 1 "https://github.com/PyAutoLabs/${WS[$proj]}" "$proj"
          done
      - name: Make script matrix
        id: script_matrix
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          # mode=release scopes to workspace + workspace_test only (per the M3
          # spec) — HowTo* are tutorial repos with no profile_release.yaml and
          # aren't part of the release-fidelity surface. mode=smoke keeps the
          # full 9-project sweep, unchanged.
          if [ "$MODE" = "release" ]; then
            PROJECTS="autofit autogalaxy autolens autofit_test autogalaxy_test autolens_test"
          else
            PROJECTS="autofit autogalaxy autolens autofit_test autogalaxy_test autolens_test howtogalaxy howtolens howtofit"
          fi
          matrix="$(python3 PyAutoHands/autohands/script_matrix.py $PROJECTS)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  generate_notebooks:
    runs-on: ubuntu-latest
    needs: find_scripts
    # Notebook generation/execution is smoke-only (out of scope for M3's
    # wheel-based release-fidelity surface, which is scripts + verify_install).
    if: needs.find_scripts.outputs.mode != 'release'
    strategy:
      fail-fast: false
      matrix:
        # Notebooks exist only for the 6 doc workspaces (the *_test workspaces
        # publish none). generate.py just converts scripts → .ipynb (no lib run).
        project:
          - { name: autofit, workspace: autofit_workspace }
          - { name: autogalaxy, workspace: autogalaxy_workspace }
          - { name: autolens, workspace: autolens_workspace }
          - { name: howtogalaxy, workspace: HowToGalaxy }
          - { name: howtolens, workspace: HowToLens }
          - { name: howtofit, workspace: HowToFit }
    steps:
      - name: Checkout PyAutoHands (generate.py)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/${{ matrix.project.workspace }}
          ref: main
          path: workspace
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install notebook tooling
        run: pip install jupyter ipynb-py-convert PyYAML
      - name: Generate notebooks
        run: |
          export PYTHONPATH="$PYTHONPATH:$(pwd)/PyAutoHands"
          pushd workspace
          python3 "$(pwd)/../PyAutoHands/autohands/generate.py" "${{ matrix.project.name }}"
      - name: Upload generated notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-${{ matrix.project.name }}
          path: workspace/notebooks/
          retention-days: 7

  run_scripts:
    runs-on: ubuntu-latest
    needs: find_scripts
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        project: ${{ fromJSON(needs.find_scripts.outputs.matrix) }}
    steps:
      - name: Checkout PyAutoHands (run primitives)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Resolve workspace repo for ${{ matrix.project.name }}
        id: ws
        run: |
          case "${{ matrix.project.name }}" in
            autofit)         echo "repo=autofit_workspace" >> "$GITHUB_OUTPUT" ;;
            autogalaxy)      echo "repo=autogalaxy_workspace" >> "$GITHUB_OUTPUT" ;;
            autolens)        echo "repo=autolens_workspace" >> "$GITHUB_OUTPUT" ;;
            autofit_test)    echo "repo=autofit_workspace_test" >> "$GITHUB_OUTPUT" ;;
            autogalaxy_test) echo "repo=autogalaxy_workspace_test" >> "$GITHUB_OUTPUT" ;;
            autolens_test)   echo "repo=autolens_workspace_test" >> "$GITHUB_OUTPUT" ;;
            howtogalaxy)     echo "repo=HowToGalaxy" >> "$GITHUB_OUTPUT" ;;
            howtolens)       echo "repo=HowToLens" >> "$GITHUB_OUTPUT" ;;
            howtofit)        echo "repo=HowToFit" >> "$GITHUB_OUTPUT" ;;
            *)               echo "repo=autolens_workspace_test" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/${{ steps.ws.outputs.repo }}
          ref: main
          path: workspace
      - name: "Checkout libraries (current main; source-shadowed via PYTHONPATH) [mode=smoke]"
        if: needs.find_scripts.outputs.mode == 'smoke'
        run: |
          set -e
          for lib in PyAutoNerves PyAutoArray PyAutoFit PyAutoGalaxy PyAutoLens; do
            git clone --depth 1 "https://github.com/PyAutoLabs/$lib" "libs/$lib"
          done
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: "Install third-party deps (libs run from source) [mode=smoke]"
        if: needs.find_scripts.outputs.mode == 'smoke'
        run: |
          # Pull the full transitive dependency set (matplotlib/numba/jax/…) by
          # installing the published autolens[optional]; the source checkouts
          # below shadow the PyAuto packages via PYTHONPATH.
          pip install "autolens[optional]"
          pip install "jax>=0.7,<0.11" "jaxlib>=0.7,<0.11"
          # nufftax backs the interferometer TransformerNUFFT and is NOT pulled
          # transitively by autolens[optional]; without it every interferometer
          # simulator (and its downstream scripts) fails fast. Matches the pin
          # PyAutoArray declares (0.6.1 floor: earlier nufftax cannot
          # differentiate a batched nufft2d2, which the gradient searches'
          # transform_mapping_matrix path relies on).
          pip install "nufftax>=0.6.1,<0.7.0"
          # blackjax backs autofit_test's searches/BlackJAXNUTS and is NOT pulled
          # transitively either: the `optional` extras chain each library's own
          # [jax], never a sibling's [optional], so autolens[optional] never
          # reaches autofit[optional]. mode=release below already installs
          # autofit[optional] explicitly — this gives the smoke leg parity.
          pip install "autofit[optional]"
          # Same gap, same rationale, for autoarray's own [optional]: it carries
          # tfp-nightly, which supplies the modified-Bessel `bessel_kve` behind
          # the JAX Matern-kernel regularization path
          # (autoarray/inversion/regularization/matern_kernel.py). Without it
          # autogalaxy_workspace_test's misc/jax_assertions/matern_regularization.py
          # and autolens_workspace_test's imaging/jax_grad/regularization.py fail
          # at import — red here while PASSING mode=release, which installs
          # autoarray[optional] explicitly (below).
          #
          # Pin the single package rather than installing autoarray[optional]:
          # this leg installs PUBLISHED wheels (source only shadows the PyAuto
          # packages, via PYTHONPATH), so a library extra resolves the RELEASED
          # metadata, which lags source main. autoarray 2026.7.29.2[optional]
          # still declares `nufftax<0.5.0,>=0.4.0`, so pulling the whole extra
          # here uninstalled the 0.6.1 pinned above and left nufftax 0.4.0 —
          # silently below the floor the gradient searches need. A future
          # addition to autoarray[optional] is caught by the Brain's
          # `hygiene extras` scan instead, which reads the SOURCE pyproject.
          pip install "tfp-nightly==0.26.0.dev20260713"
      - name: "Install TestPyPI wheels — NO source on PYTHONPATH [mode=release]"
        if: needs.find_scripts.outputs.mode == 'release'
        env:
          TESTPYPI_VERSION: ${{ inputs.testpypi_version }}
        run: |
          set -e
          if [ -z "$TESTPYPI_VERSION" ]; then
            echo "::error::mode=release requires a testpypi_version input (from the M1 rehearsal artifact)"
            exit 1
          fi
          # Same retry pattern release.yml's run_smoke_tests job uses — TestPyPI
          # uploads can take a few seconds to propagate to the index.
          install_cnt=0
          until python3 -m pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple \
                "autonerves[optional]==$TESTPYPI_VERSION" \
                "autoarray[optional]==$TESTPYPI_VERSION" \
                "autofit[optional]==$TESTPYPI_VERSION" \
                "autogalaxy[optional]==$TESTPYPI_VERSION" \
                "autolens[optional]==$TESTPYPI_VERSION"; do
            install_cnt=$((install_cnt + 1))
            if [ "$install_cnt" -ge 30 ]; then
              echo "::error::TestPyPI install failed after 30 attempts"
              exit 1
            fi
            sleep 10
          done
          # NOT pinning matplotlib here (unlike release.yml's run_smoke_tests,
          # which pins matplotlib==3.6.0): PyAutoArray's own pyproject.toml
          # requires matplotlib>=3.7.0, already satisfied by the wheels just
          # installed above, and 3.6.0 predates cp312 wheel builds entirely
          # (confirmed via `pip download matplotlib==3.6.0 --python-version 312
          # --only-binary=:all:` — no matching distribution) — pinning down to
          # it would force an unnecessary, needlessly slow source rebuild for
          # zero benefit on a version this job's own wheels already reject.
          pip install numba
          # Belt-and-braces JAX install — the [optional] -> [jax] chain
          # occasionally silently drops jax from test.pypi resolution.
          pip install "jax>=0.7,<0.11" "jaxlib>=0.7,<0.11"
          pip install "nufftax>=0.6.1,<0.7.0"
      - name: "Run Python scripts [mode=smoke, source-shadowed, smoke profile]"
        if: needs.find_scripts.outputs.mode == 'smoke'
        run: |
          LIBS="$(pwd)/libs"
          export PYTHONPATH="$LIBS/PyAutoNerves:$LIBS/PyAutoArray:$LIBS/PyAutoFit:$LIBS/PyAutoGalaxy:$LIBS/PyAutoLens:$(pwd)/PyAutoHands:$PYTHONPATH"
          pushd workspace
          python3 "$(pwd)/../PyAutoHands/autohands/run_python.py" \
            "${{ matrix.project.name }}" "scripts/${{ matrix.project.directory }}" \
            --report-dir test-results
      - name: "Run Python scripts [mode=release, wheels, release profile, no source on PYTHONPATH]"
        if: needs.find_scripts.outputs.mode == 'release'
        env:
          # mode=release runs REAL searches (PYAUTO_TEST_MODE=0) and finite-difference
          # JAX gradient scripts, which legitimately exceed the 300s smoke cap
          # (build_util.py BUILD_SCRIPT_TIMEOUT default). Raise it here so a slow-but-
          # correct script isn't a false release blocker. This is a stopgap while the
          # Profiling Agent drives the JAX compile/eval-time speedups (PyAutoMind
          # draft/feature/profiling/profiling_agent_jax_compile_time_scope.md).
          #
          # This is a RUN-WIDE value: it applies to every script in the release leg.
          # A workspace env profile may now also set BUILD_SCRIPT_TIMEOUT on an
          # `overrides` pattern, which build_util.timeout_for resolves per script and
          # which WINS over this global (PyAutoHands#227) — profile_release.yaml
          # currently sets no such override, so the release leg is unaffected.
          #
          # This comment previously read "smoke mode is unchanged (still 300s)". That
          # was true of the workflow but wrong as a premise: it assumed smoke work is
          # reduced, and the jax_grad scripts declare `ENV: jax full_datasets` and run
          # NO search, so smoke reduces nothing for them — they do the same FD work
          # under both profiles. Three of them TIMEOUT at 300s in smoke (run
          # 30858578587). The smoke budget for that class now lives where it belongs,
          # per-script in the workspace's own config/build/profile_smoke.yaml, rather
          # than as a second run-wide number here (PyAutoHands#226).
          BUILD_SCRIPT_TIMEOUT: "1800"
        run: |
          # Deliberately NOT adding library source dirs to PYTHONPATH (closes
          # Gap A) — `import autolens` etc. resolve to the pip-installed
          # wheels. Still executed FROM WITHIN the workspace checkout (pushd)
          # so autonerves resolves the workspace's own config/ + dataset/, not
          # the wheel's packaged defaults (closes Gap 4).
          set -e
          pushd workspace
          # Use the canonical profile_release.yaml (PyAutoHands#161/#181 step
          # 6 rename).
          if [ -f "config/build/profile_release.yaml" ]; then
            ENV_CONFIG="config/build/profile_release.yaml"
          else
            echo "::error::config/build/profile_release.yaml missing — no release profile defined for this workspace"
            exit 1
          fi
          python3 "$(pwd)/../PyAutoHands/autohands/run_python.py" \
            "${{ matrix.project.name }}" "scripts/${{ matrix.project.directory }}" \
            --report-dir test-results \
            --env-config "$ENV_CONFIG"
      - name: Upload script results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-scripts-${{ matrix.project.name }}-${{ matrix.project.directory }}
          path: workspace/test-results/
          retention-days: 30
      - name: Upload the per-script timings (scripts leg) under a globbable name
        # PyAutoHands#264 gave RunReport.write() a consolidated
        # smoke_timings.json, and PyAutoHeart#167 published it from the PR gate
        # (smoke-tests.yml) as `smoke-timings-<python-version>`. This body never
        # did — so the WIDEST timing sample the organism produces, the weekly
        # workspace-smoke sweep, survived only INSIDE the `results-*` zips above,
        # under no name a consumer could glob for.
        #
        # WHY A SEPARATE ARTIFACT and not a wider `results-*` glob: the artifact
        # NAME is the contract the deferred Heart-board timing ingester globs on
        # (`smoke-timings-*`). `results-*` is a different contract — it is what
        # the `analyze` job downloads and hands to aggregate_results.py, which
        # globs `**/*.json` and skips this sidecar BY NAME. Publishing timings
        # under a `results-*` name would aim them straight at the one consumer
        # that deliberately excludes them.
        #
        # WHY THE LEG SUFFIX: the PR gate has one leg per python version, so a
        # fixed name is safe there. This body runs ~50 legs in a single weekly
        # run, so the name must carry the leg — (project.name, project.directory)
        # is exactly the pair the `results-*` upload above already relies on the
        # script matrix to keep unique.
        #
        # WHY ONLY THE JSON, not the whole report dir: the report dir already
        # ships as `results-*` above. Duplicating ~50 of them weekly buys
        # nothing; the gap is discoverability, and the timings file is the part
        # a consumer wants.
        #
        # NO retention-days (unlike the 30 above, deliberately): the dataset IS
        # the point, matching the PR gate's reasoning — the timings keep the
        # repo's full default artifact retention and outlive the report dirs
        # they came from. One small JSON per leg, so the cost is negligible.
        #
        # if: always() + if-no-files-found: ignore are both load-bearing. A leg
        # that fails still has timings worth keeping; a leg that dies before the
        # first report write (a failed install, an empty script list) leaves no
        # report dir at all — and an upload failing closed would turn "we
        # collected no timings" into "the weekly sweep is red", which is exactly
        # backwards.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-timings-scripts-${{ matrix.project.name }}-${{ matrix.project.directory }}
          path: workspace/**/smoke_timings.json
          if-no-files-found: ignore

  run_notebooks:
    runs-on: ubuntu-latest
    needs: [find_scripts, generate_notebooks]
    # Notebook execution is smoke-only — see generate_notebooks.
    if: needs.find_scripts.outputs.mode != 'release'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        project: ${{ fromJSON(needs.find_scripts.outputs.matrix) }}
    steps:
      - name: Gate (*_test workspaces have no notebooks)
        id: gate
        run: |
          if [[ "${{ matrix.project.name }}" == *_test ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout PyAutoHands (run primitives)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Resolve workspace repo
        if: steps.gate.outputs.run == 'true'
        id: ws
        run: |
          case "${{ matrix.project.name }}" in
            autofit)     echo "repo=autofit_workspace" >> "$GITHUB_OUTPUT" ;;
            autogalaxy)  echo "repo=autogalaxy_workspace" >> "$GITHUB_OUTPUT" ;;
            autolens)    echo "repo=autolens_workspace" >> "$GITHUB_OUTPUT" ;;
            howtogalaxy) echo "repo=HowToGalaxy" >> "$GITHUB_OUTPUT" ;;
            howtolens)   echo "repo=HowToLens" >> "$GITHUB_OUTPUT" ;;
            howtofit)    echo "repo=HowToFit" >> "$GITHUB_OUTPUT" ;;
            *)           echo "repo=autolens_workspace" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Checkout workspace
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/${{ steps.ws.outputs.repo }}
          ref: main
          path: workspace
      - name: Checkout libraries (source-shadowed via PYTHONPATH)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -e
          for lib in PyAutoNerves PyAutoArray PyAutoFit PyAutoGalaxy PyAutoLens; do
            git clone --depth 1 "https://github.com/PyAutoLabs/$lib" "libs/$lib"
          done
      - name: Download generated notebooks
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: notebooks-${{ matrix.project.name }}
          path: workspace/notebooks/
      - name: Set up Python ${{ matrix.python-version }}
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps (libs from source) + jupyter
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install "autolens[optional]"
          pip install "jax>=0.7,<0.11" "jaxlib>=0.7,<0.11"
          pip install "nufftax>=0.6.1,<0.7.0"
          pip install jupyter ipynb-py-convert
      - name: Run notebooks
        if: steps.gate.outputs.run == 'true'
        run: |
          LIBS="$(pwd)/libs"
          export PYTHONPATH="$LIBS/PyAutoNerves:$LIBS/PyAutoArray:$LIBS/PyAutoFit:$LIBS/PyAutoGalaxy:$LIBS/PyAutoLens:$(pwd)/PyAutoHands:$PYTHONPATH"
          pushd workspace
          python3 "$(pwd)/../PyAutoHands/autohands/run.py" \
            "${{ matrix.project.name }}" "notebooks/${{ matrix.project.directory }}" \
            --report-dir test-results
      - name: Upload notebook results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: results-notebooks-${{ matrix.project.name }}-${{ matrix.project.directory }}
          path: workspace/test-results/
          retention-days: 30
      - name: Upload the per-script timings (notebooks leg) under a globbable name
        # The notebook leg's report is written by run.py, which reaches the same
        # RunReport.write() — so it emits smoke_timings.json too, and it is half
        # the weekly timing sample. Full rationale on the scripts leg's copy of
        # this step above; only the name's leg segment and the gate differ.
        #
        # The gate is carried over from the results-* upload: the *_test
        # workspaces publish no notebooks, so those legs skip execution entirely
        # and have nothing to collect.
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-timings-notebooks-${{ matrix.project.name }}-${{ matrix.project.directory }}
          path: workspace/**/smoke_timings.json
          if-no-files-found: ignore

  analyze:
    runs-on: ubuntu-latest
    needs: [run_scripts, run_notebooks]
    if: always()
    steps:
      - name: Checkout PyAutoHands (aggregate_results)
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: results-*
          merge-multiple: true
      - name: Aggregate into report.json
        run: |
          export PYTHONPATH="$PYTHONPATH:$(pwd)/PyAutoHands"
          python3 PyAutoHands/autohands/aggregate_results.py all-results/ \
            --output report.json --markdown report.md
      - name: Post summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload report (consumed by pyauto-heart readiness / mode=release stage-report step)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-validation-report
          path: |
            report.json
            report.md
          retention-days: 90
      - name: Fail the run if validation is not ready
        run: |
          python3 -c "import json,sys; sys.exit(0 if json.load(open('report.json')).get('ready') else 1)"

  # ---------------------------------------------------------------------------
  # mode=release only, from here down. verify_install_release closes item 5
  # (verify_install A-F against the same exact wheels, including the Python
  # 3.11 Requires-Python rejection); emit_release_report closes
  # item 4 (the {"stage": "integrate", ...} report `pyauto-heart validate
  # --ingest` understands). Both are pure CI-side steps run with Heart's own
  # code, checked out from THIS repo — no dispatch, no other-repo mutation.
  # ---------------------------------------------------------------------------

  verify_install_release:
    runs-on: ubuntu-latest
    needs: find_scripts
    if: needs.find_scripts.outputs.mode == 'release'
    steps:
      - name: Checkout PyAutoHeart
        uses: actions/checkout@v4
      # Checks B and E invoke explicit pythonX.Y binaries in one job. setup-python
      # prepends each toolcache interpreter without removing the earlier paths.
      - name: Expose Python 3.11 for the below-floor rejection
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expose Python 3.12 for Checks B and E
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expose supported Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run verify_install A-F against the TestPyPI wheels
        env:
          TESTPYPI_VERSION: ${{ inputs.testpypi_version }}
        run: |
          set -e
          if [ -z "$TESTPYPI_VERSION" ]; then
            echo "::error::mode=release requires a testpypi_version input"
            exit 1
          fi
          bash heart/checks/verify_install.sh --testpypi --version "$TESTPYPI_VERSION" \
            --report-json verify_install.json
      - name: Upload verify_install report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-install-release
          path: verify_install.json
          retention-days: 90

  emit_release_report:
    runs-on: ubuntu-latest
    needs: [analyze, verify_install_release, find_scripts]
    if: always() && needs.find_scripts.outputs.mode == 'release'
    steps:
      - name: Checkout PyAutoHeart
        uses: actions/checkout@v4
      - name: Download aggregated script report
        uses: actions/download-artifact@v4
        with:
          name: workspace-validation-report
          path: aggregate
      - name: Download verify_install report
        uses: actions/download-artifact@v4
        with:
          name: verify-install-release
          path: verify
      - name: Write commit_shas.json from the dispatch input
        env:
          COMMIT_SHAS_JSON: ${{ inputs.commit_shas }}
        run: |
          printf '%s' "$COMMIT_SHAS_JSON" > commit_shas.json
          python3 -c "import json; json.load(open('commit_shas.json'))" || {
            echo "::error::commit_shas input is not valid JSON (got: $COMMIT_SHAS_JSON)"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Emit the integrate stage report
        env:
          PYTHONPATH: ${{ github.workspace }}
          TESTPYPI_VERSION: ${{ inputs.testpypi_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -m heart.validate \
            --emit-stage-report aggregate/report.json \
            --stage integrate \
            --profile release \
            --testpypi-version "$TESTPYPI_VERSION" \
            --commit-shas commit_shas.json \
            --verify-install verify/verify_install.json \
            --run-url "$RUN_URL" \
            --out stage_report.json
      - name: Post summary
        if: always()
        run: |
          if [ -f stage_report.json ]; then
            {
              echo '```json'
              cat stage_report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload stage report (consumed by `pyauto-heart validate --ingest`)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stage-report
          path: stage_report.json
          retention-days: 90
