name: Install arcticpy
description: >-
  Build and install arcticpy, the C++ arctic clocking code that `import autocti`
  hard-requires. The canonical recipe for the whole organism — every CTI repo's
  CI consumes this action rather than carrying its own copy.

# The recipe, the reasoning behind its two awkward pip flags, and the single
# `arcticpy==2.6` pin all live in `install_arcticpy.sh` beside this file. This
# action is a thin CI wrapper over it — read that script, not this, to
# understand or change what gets installed.
#
# Why the split: `heart/smoke.py` prepares the same arcticpy for Heart's LOCAL
# smoke runner, and a composite action cannot be invoked from Python. A shell
# script is the one shape both consumers can execute, so the recipe stays in
# exactly one place. #170 replaced four divergent copies with one; a second copy
# here would undo it.

inputs:
  version:
    description: >-
      Override the arcticpy version to build. Leave EMPTY (the default) to use
      the organism's pin, which lives in exactly one place — the
      ARCTICPY_VERSION default at the top of install_arcticpy.sh. Bump it there.
      A default here would be a second copy of the pin, which is the thing #170
      removed.
    required: false
    default: ""
  sudo:
    description: >-
      Use sudo for the apt-get leg. GitHub-hosted runners need it; a container
      already running as root does not have it. Set to 'false' there.
    required: false
    default: "true"
  install-gsl:
    description: >-
      Install libgsl-dev via apt. Set to 'false' when GSL headers are already
      present (a prepared image, or a no-root local extraction).
    required: false
    default: "true"

outputs:
  version:
    description: "The arcticpy version actually installed, per importlib.metadata."
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    # The recipe itself lives in install_arcticpy.sh beside this file, NOT in
    # these steps. That is deliberate: `heart/smoke.py` prepares the same
    # arcticpy for the LOCAL smoke runner, and a composite action cannot be
    # invoked from Python. A shell script is the one shape both consumers can
    # execute, so the recipe and the `2.6` pin stay in exactly one place —
    # which is the whole point of #170 (it replaced four divergent copies).
    #
    # `github.action_path` is the directory this action was downloaded into, so
    # this resolves for a consumer that has no checkout of PyAutoHeart — the
    # property that made a composite action the right shape to begin with.
    - name: Build and install arcticpy
      id: verify
      shell: bash
      env:
        ARCTICPY_VERSION: ${{ inputs.version }}
        ARCTICPY_INSTALL_GSL: ${{ inputs.install-gsl }}
        ARCTICPY_SUDO: ${{ inputs.sudo }}
      run: bash "${{ github.action_path }}/install_arcticpy.sh"
