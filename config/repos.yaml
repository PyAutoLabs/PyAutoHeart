# PyAutoHeart polled-repo registry.
#
# Repos listed here are polled every `tick` for CI / drift / timing.
# Repos NOT listed are silently ignored. To add/remove a repo, edit
# this file and reload the daemon (`pyauto-heart stop && pyauto-heart watch`).
#
# This file is Heart POLICY (what to poll, what gates, what counts as noise).
# Repo IDENTITY (name/owner) must match PyAutoMind/repos.yaml — the body map;
# `python3 PyAutoMind/scripts/repos_sync.py --check` flags any drift.

repos:
  libraries:
    - name: PyAutoNerves
      owner: PyAutoLabs
    - name: PyAutoFit
      owner: PyAutoLabs
    - name: PyAutoArray
      owner: PyAutoLabs
    - name: PyAutoGalaxy
      owner: PyAutoLabs
    - name: PyAutoLens
      owner: PyAutoLabs
    - name: PyAutoCTI
      owner: PyAutoLabs
      # Polled for health/CI, but NOT part of the release-validation gate yet:
      # PyAutoCTI is mid-resurrection (not released), so it has no release
      # evidence to confirm. Flip to true (or drop this key) when CTI ships.
      release_gate: false

  build_workflow:
    - name: PyAutoHands
      owner: PyAutoLabs
    - name: PyAutoMind
      owner: PyAutoLabs

  workspaces:
    - name: autofit_workspace
      owner: PyAutoLabs
    - name: autogalaxy_workspace
      owner: PyAutoLabs
    - name: autolens_workspace
      owner: PyAutoLabs
    - name: autocti_workspace
      owner: PyAutoLabs

  workspaces_test:
    - name: autofit_workspace_test
      owner: PyAutoLabs
    - name: autogalaxy_workspace_test
      owner: PyAutoLabs
    - name: autolens_workspace_test
      owner: PyAutoLabs
    - name: autocti_workspace_test
      owner: PyAutoLabs

  workspaces_developer:
    - name: autofit_workspace_developer
      owner: PyAutoLabs
    - name: autolens_workspace_developer
      owner: PyAutoLabs

  howto:
    - name: HowToFit
      owner: PyAutoLabs
    - name: HowToGalaxy
      owner: PyAutoLabs
    - name: HowToLens
      owner: PyAutoLabs

  pipelines:
    - name: euclid_strong_lens_modeling_pipeline
      owner: PyAutoLabs

  # The PyAuto "organism" repos — the reasoning/health/memory layer. Heart
  # watching itself (and its siblings) is intentional and useful: drift or a
  # red CI on these is just as real as on a library.
  organism:
    - name: PyAutoBrain
      owner: PyAutoLabs
    - name: PyAutoHeart
      owner: PyAutoLabs
    - name: PyAutoMemory
      owner: PyAutoLabs

# Required gating workflows per group, keyed by the GitHub Actions workflow
# *name* (the `name:` field, e.g. "Smoke Tests"), matched against
# `workflowName` from `gh run list`. `ci_status` records the conclusion of each
# of these on the `main` HEAD commit, and `readiness` gates (RED) on a failure
# of any of them. Groups absent here are observed but advisory — their latest
# run is recorded for the dashboard but never blocks a release.
#
# NOTE: url-checking is deliberately NOT a required workflow. It moved off the
# per-repo `url_check.yml` into PyAutoHeart's central `url-check.yml` sweep and
# is monitoring-only (see the URL HYGIENE block in status.py) — a forbidden-URL
# finding never gates a release, so a green `url_check` cannot mask a red
# `smoke_tests`.
required_workflows:
  libraries: ["Tests"]                              # main.yml (pytest, 3.12 + 3.13)
  workspaces: ["Smoke Tests", "Navigator Check"]    # smoke_tests.yml + navigator_check.yml
  workspaces_test: ["Smoke Tests"]                  # smoke_tests.yml
  howto: ["Smoke Tests", "Navigator Check"]         # smoke_tests.yml + navigator_check.yml

# Performance policy: the extra workflows `ci_timing` times BEYOND each group's
# `required_workflows` above. Those required gates are timed automatically (the
# speed row and the health row must be about the same workflows); this block is
# for the scheduled, full-surface drivers that gate nothing per-PR but whose
# wall-clock is exactly what a slow-down would show up in first — the weekly
# full workspace smoke sweep and the nightly release driver.
#
# Keyed by workflow *display name* (the `name:` field), same convention as
# `required_workflows`, matched against the run's `name` in the Actions API.
performance:
  extra_workflows:
    - repo: PyAutoHeart
      workflow: "Workspace Smoke"
    - repo: PyAutoBrain
      workflow: "Nightly Release"

# Version-skew policy: workspace pin vs installed library. Iterated directly
# by heart/checks/version_skew.py — independent of polling (includes unpolled
# repos like the assistant). An adopter replaces this with their own map.
version_skew:
  autofit_workspace: {library: PyAutoFit, package: autofit}
  autogalaxy_workspace: {library: PyAutoGalaxy, package: autogalaxy}
  autolens_workspace: {library: PyAutoLens, package: autolens}
  HowToFit: {library: PyAutoFit, package: autofit}
  HowToGalaxy: {library: PyAutoGalaxy, package: autogalaxy}
  HowToLens: {library: PyAutoLens, package: autolens}
  euclid_strong_lens_modeling_pipeline: {library: PyAutoLens, package: autolens}
  autolens_assistant: {library: PyAutoLens, package: autolens}

# Smoke-suite table: the workspaces the local smoke runner (heart/smoke.py)
# can prepare and run — each key names its workspace checkout directory and the
# library install chain — plus the repo -> import-package map the preflight
# proves. Read strictly by heart/smoke.py (a missing block fails loudly rather
# than silently preparing nothing); an adopter replaces this with their own
# workspaces. Repo IDENTITY here must match the body map, same as above.
smoke:
  import_names:
    PyAutoNerves: autonerves
    PyAutoFit: autofit
    PyAutoArray: autoarray
    PyAutoGalaxy: autogalaxy
    PyAutoLens: autolens
    PyAutoCTI: autocti
  workspaces:
    autofit:
      directory: autofit_workspace
      chain: [PyAutoNerves, PyAutoFit]
    autogalaxy:
      directory: autogalaxy_workspace
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoGalaxy]
    autolens:
      directory: autolens_workspace
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoGalaxy, PyAutoLens]
    autolens_test:
      directory: autolens_workspace_test
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoGalaxy, PyAutoLens]
    euclid:
      directory: euclid_strong_lens_modeling_pipeline
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoGalaxy, PyAutoLens]
    howtolens:
      directory: HowToLens
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoGalaxy, PyAutoLens]
    # The CTI chain does NOT include autogalaxy/autolens — autolens sits on
    # autogalaxy, autocti does not. It matches what both repos' CI callers
    # declare.
    #
    # `arcticpy: true` mirrors the input those same CI callers pass to Heart's
    # reusable smoke-tests.yml. `import autocti` hard-requires arcticpy, which is
    # not a pip dependency (source-only C++ sdist, needs libgsl-dev, and its own
    # requirements downgrade numpy below 2.0). CI gets it from the
    # install-arcticpy composite action; a composite action cannot be invoked
    # from smoke.py, so the local runner executes the same underlying script,
    # `.github/actions/install-arcticpy/install_arcticpy.sh`. One recipe, one
    # pin, both consumers — see PyAutoHeart#170/#172.
    autocti:
      directory: autocti_workspace
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoCTI]
      arcticpy: true
    autocti_test:
      directory: autocti_workspace_test
      chain: [PyAutoNerves, PyAutoFit, PyAutoArray, PyAutoCTI]
      arcticpy: true

# Excluded — not polled. Listed here for documentation only.
excluded:
  - admin_jammy           # personal tooling
  - autolens_assistant    # public-facing template
  - autolens_profiling    # profiling project
  - z_help                # scratch
  - z_projects            # in-progress science
  - z_projects_complete   # archived science
  - z_staging             # staging area
  - z_vault               # archived material
  - scripts               # utility scripts (not a checkout)

# Regenerated artifacts that perpetually show as dirty in `git status`.
# A porcelain path matching any of these globs (or any untracked directory)
# is counted as "generated noise" — informational, NOT actionable — and is
# excluded from the dirty_yellow/dirty_red drift signal. Matched with
# fnmatch, where `*` crosses `/` (so `*.fits` matches dataset/.../x.fits).
# Tune freely; remove a pattern to make those changes surface as real drift.
#
# Deliberately FILE-TYPE scoped, not directory scoped: a blanket `dataset/*`
# or `*/results/*` rule would wrongly hide genuine hand-edited source — e.g.
# autolens_workspace_developer has real `.py` under `source_science/results/`.
# Matching by generated filename/extension keeps those `.py` edits visible.
noise_globs:
  - "*.fits"
  - "*tracer.json"          # tracer.json, g_tracer.json, r_tracer.json
  - "*point_dataset*.json"
  - "*positions.json"       # generated dataset positions (HowToLens etc.)
  - "*data.json"            # regenerated dataset payloads
  - "*model.json"           # model snapshots
  - "*model_*.json"         # model_0.json, model_1.json, …
  - "*max_log_likelihood.json"  # result snapshots
  - "*galaxies.json"        # generated dataset galaxies (HowTo*, *_test)
  - "*dataset.json"         # generated dataset payloads (weak/simple/dataset.json)
  - "*tracer_*.json"        # tracer_imaging.json / tracer_point.json variants
  - "*point_dataset*.csv"   # csv twins of the point_dataset json artifacts
  - "*.npy"                 # generated numpy payloads (los_halo_list.npy etc.)
  - "*summary.json"         # generated profiling summaries (postfix_N*_summary.json)
  - "*summary_v*.json"      # versioned profiling summaries (imaging_summary_v2026.5.14.2.json)
  - "*comparison.json"      # jax_profiling result comparisons
  - "*hpc_*.json"           # jax_profiling HPC run results (hpc_a100_fp64/mp.json)
  - "*.png"                 # generated plots / figures (global; PNGs here are always generated)
  - "*README.md"            # build-regenerated workspace docs
  - "*test_report.md"

# Tunable thresholds for the regression classifier.
thresholds:
  script_timing:
    yellow_factor: 1.5    # latest / median > this → yellow
    red_factor: 3.0       # latest / median > this → red
    baseline_window: 7    # rolling-median window (last N runs)
  repo_drift:
    behind_yellow: 1      # 1+ commits behind → yellow
    behind_red: 20        # 20+ commits behind → red
    dirty_yellow: 1       # 1+ dirty files → yellow
    dirty_red: 50         # 50+ dirty files → red
  ci_status:
    failure_red: true     # any latest=failure → red
    in_progress_yellow: true
  # CI wall-clock drift (heart/checks/ci_timing.py). A gate is flagged only when
  # today's median is BOTH >= yellow_factor x its own recent history AND at
  # least min_delta_s slower in absolute terms. Both gates, deliberately: the
  # ratio alone screams at jitter (host load alone has produced 7x errors in
  # this corpus, and an alarm that cries wolf gets ignored), while the absolute
  # floor alone would miss a large relative drift on a cheap gate. Advisory —
  # a slowed gate never reds the readiness verdict.
  ci_timing:
    yellow_factor: 1.5    # median / recent-history median >= this, AND
    min_delta_s: 120      # ... at least this many seconds slower
    history_cap: 30       # days of self-carried per-gate history
  worktree_drift:
    orphan_red: true      # orphan WT with uncommitted work → red
    orphan_yellow: true   # orphan WT (clean) → yellow
